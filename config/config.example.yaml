# Referencia de configuración para el workshop.
# Puedes configurar todo desde el dashboard (recomendado) o usar este archivo
# como guía. Reemplaza los endpoints con los valores de tu .env.
#
# Validar antes de usar:
#   vllm-sr validate --config config/config.example.yaml

version: v0.3

global:
  integrations:
    tools:
      enabled: false

listeners:
  - name: http-chat
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    default_model: llama-scout-17b
  models:
    - name: llama-scout-17b
      backend_refs:
        - name: primary
          base_url: https://maas-rhdp.apps.maas.redhatworkshops.io
          type: chat
          provider: openai
          api_key_env: OPENSHIFT_AI_TOKEN
          auth_header: Authorization
          auth_prefix: Bearer
          chat_path: /v1/chat/completions
    - name: qwen3-14b
      backend_refs:
        - name: primary
          base_url: https://maas-rhdp.apps.maas.redhatworkshops.io
          type: chat
          provider: openai
          api_key_env: OPENSHIFT_AI_TOKEN
          auth_header: Authorization
          auth_prefix: Bearer
          chat_path: /v1/chat/completions
    - name: granite-3-2-8b-instruct
      backend_refs:
        - name: primary
          base_url: https://maas-rhdp.apps.maas.redhatworkshops.io
          type: chat
          provider: openai
          api_key_env: OPENSHIFT_AI_TOKEN
          auth_header: Authorization
          auth_prefix: Bearer
          chat_path: /v1/chat/completions

routing:
  modelCards:
    - name: llama-scout-17b
      description: Consultas generales y conversación
      modality: text
    - name: qwen3-14b
      description: Código, debugging y scripts
      modality: text
    - name: granite-3-2-8b-instruct
      description: Datos personales, PII e información privada
      modality: text

  signals:
    domains:
      - name: code
        description: Programación, software, debugging, SQL, scripts y algoritmos
        mmlu_categories: ["computer science"]
      - name: general
        description: Conversación, conocimiento general, redacción y preguntas abiertas
        mmlu_categories: [other]
    keywords:
      - name: sensitive_data
        operator: OR
        keywords:
          - ssn
          - social security
          - credit card
          - personal information
          - private information
          - datos personales
          - información privada
        case_sensitive: false

  decisions:
    - name: privacy-route
      description: Consultas con datos personales van a Granite
      priority: 250
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: sensitive_data
      modelRefs:
        - model: granite-3-2-8b-instruct

    - name: code-route
      description: Consultas de código van a Qwen3
      priority: 150
      rules:
        operator: AND
        conditions:
          - type: domain
            name: code
      modelRefs:
        - model: qwen3-14b

    - name: general-route
      description: Todo lo demás va a Llama Scout
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: general
      modelRefs:
        - model: llama-scout-17b
