# Referencia de configuración para el workshop.
# Puedes configurar todo desde el dashboard (recomendado) o usar este archivo
# como guía. Reemplaza los endpoints con los valores de tu .env.
#
# Validar antes de usar:
#   vllm-sr validate --config config/config.example.yaml

version: v0.3

listeners:
  - name: http-chat
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    default_model: llama-32-3b
  models:
    - name: llama-32-3b
      backend_refs:
        - name: primary
          base_url: https://your-openshift-ai-host/llama-32-3b
          api_key_env: OPENSHIFT_AI_TOKEN
          auth_header: Authorization
          auth_prefix: Bearer
          chat_path: /v1/chat/completions
    - name: qwen35-9b
      backend_refs:
        - name: primary
          base_url: https://your-openshift-ai-host/qwen35-9b
          api_key_env: OPENSHIFT_AI_TOKEN
          auth_header: Authorization
          auth_prefix: Bearer
          chat_path: /v1/chat/completions
    - name: granite-vision-32-2b
      backend_refs:
        - name: primary
          base_url: https://your-openshift-ai-host/granite-vision-32-2b
          api_key_env: OPENSHIFT_AI_TOKEN
          auth_header: Authorization
          auth_prefix: Bearer
          chat_path: /v1/chat/completions

routing:
  modelCards:
    - name: llama-32-3b
      description: Consultas generales y conversación
      modality: text
    - name: qwen35-9b
      description: Código, debugging y scripts
      modality: text
    - name: granite-vision-32-2b
      description: Imágenes y análisis visual
      modality: multimodal

  signals:
    domains:
      - name: code
        description: Programación, software, debugging, SQL, scripts y algoritmos
      - name: vision
        description: Imágenes, fotos, OCR, descripción visual y análisis de gráficos
      - name: general
        description: Conversación, conocimiento general, redacción y preguntas abiertas

  decisions:
    - name: code-route
      description: Consultas de código van a Qwen
      priority: 10
      rules:
        operator: AND
        conditions:
          - type: domain
            name: code
      modelRefs:
        - model: qwen35-9b

    - name: vision-route
      description: Consultas con imágenes van a Granite Vision
      priority: 20
      rules:
        operator: AND
        conditions:
          - type: domain
            name: vision
      modelRefs:
        - model: granite-vision-32-2b

    - name: general-route
      description: Todo lo demás va a Llama
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: domain
            name: general
      modelRefs:
        - model: llama-32-3b
